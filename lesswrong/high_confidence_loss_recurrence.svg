<svg xmlns="http://www.w3.org/2000/svg" width="1961" height="698" viewBox="0 0 1961 698" role="img" aria-labelledby="title desc">
  <title id="title">High-confidence qualified-loss recurrence by cohort</title>
  <desc id="desc">Two-panel bar chart in the same style as the cohort loss-rate figure. MMLU-Pro and GPQA Diamond each compare seed-0 loss questions against final-correct and stable-wrong matched controls under a 0.9/0.9 confidence filter.</desc>
  <rect width="1961" height="698" fill="#ffffff"/>
  <style>
    text {
      font-family: "DejaVu Sans", Arial, sans-serif;
      fill: #000000;
    }
    .title {
      font-size: 32px;
      font-weight: 400;
    }
    .axis-label {
      font-size: 28px;
    }
    .tick {
      font-size: 24px;
    }
    .annotation {
      font-size: 22px;
    }
    .bar-value {
      font-size: 26px;
    }
    .axis {
      stroke: #000000;
      stroke-width: 2;
      fill: none;
    }
  </style>

  <!-- Shared geometry: y range 0.0 to 1.0, plot top 55, bottom 596, height 541. -->
  <!-- Left panel: MMLU-Pro -->
  <g id="mmlu" transform="translate(110,0)">
    <rect class="axis" x="0" y="55" width="881" height="541"/>
    <text class="title" x="440.5" y="40" text-anchor="middle">MMLU-Pro</text>
    <text class="axis-label" x="-78" y="325.5" text-anchor="middle" transform="rotate(-90 -78 325.5)">Normalised loss rate across reruns</text>

    <g class="ticks">
      <line class="axis" x1="-10" y1="596.0" x2="0" y2="596.0"/>
      <line class="axis" x1="-10" y1="487.8" x2="0" y2="487.8"/>
      <line class="axis" x1="-10" y1="379.6" x2="0" y2="379.6"/>
      <line class="axis" x1="-10" y1="271.4" x2="0" y2="271.4"/>
      <line class="axis" x1="-10" y1="163.2" x2="0" y2="163.2"/>
      <line class="axis" x1="-10" y1="55.0" x2="0" y2="55.0"/>
      <text class="tick" x="-26" y="604" text-anchor="end">0.0</text>
      <text class="tick" x="-26" y="496" text-anchor="end">0.2</text>
      <text class="tick" x="-26" y="388" text-anchor="end">0.4</text>
      <text class="tick" x="-26" y="279" text-anchor="end">0.6</text>
      <text class="tick" x="-26" y="171" text-anchor="end">0.8</text>
      <text class="tick" x="-26" y="63" text-anchor="end">1.0</text>
    </g>

    <text class="annotation" x="18" y="82">Δ vs final correct: +23.2% [+12.0%, +35.6%]</text>
    <text class="annotation" x="18" y="107">Δ vs stable wrong: +18.4% [+7.6%, +30.4%]</text>

    <rect x="39" y="459.7" width="229" height="136.3" fill="#b91c1c"/>
    <rect x="326" y="585.2" width="229" height="10.8" fill="#15803d"/>
    <rect x="613" y="559.2" width="229" height="36.8" fill="#6b7280"/>
    <text class="bar-value" x="153.5" y="449.7" text-anchor="middle">25.2%</text>
    <text class="bar-value" x="440.5" y="575.2" text-anchor="middle">2.0%</text>
    <text class="bar-value" x="727.5" y="549.2" text-anchor="middle">6.8%</text>

    <line class="axis" x1="153.5" y1="596" x2="153.5" y2="606"/>
    <line class="axis" x1="440.5" y1="596" x2="440.5" y2="606"/>
    <line class="axis" x1="727.5" y1="596" x2="727.5" y2="606"/>
    <text class="tick" x="153.5" y="666" text-anchor="middle" transform="rotate(-15 153.5 666)">Seed-0 loss</text>
    <text class="tick" x="440.5" y="666" text-anchor="middle" transform="rotate(-15 440.5 666)">Final-correct</text>
    <text class="tick" x="727.5" y="666" text-anchor="middle" transform="rotate(-15 727.5 666)">Stable-wrong</text>
  </g>

  <!-- Right panel: GPQA Diamond -->
  <g id="gpqa" transform="translate(1062,0)">
    <rect class="axis" x="0" y="55" width="881" height="541"/>
    <text class="title" x="440.5" y="40" text-anchor="middle">GPQA Diamond</text>
    <text class="axis-label" x="-78" y="325.5" text-anchor="middle" transform="rotate(-90 -78 325.5)">Normalised loss rate across reruns</text>

    <g class="ticks">
      <line class="axis" x1="-10" y1="596.0" x2="0" y2="596.0"/>
      <line class="axis" x1="-10" y1="487.8" x2="0" y2="487.8"/>
      <line class="axis" x1="-10" y1="379.6" x2="0" y2="379.6"/>
      <line class="axis" x1="-10" y1="271.4" x2="0" y2="271.4"/>
      <line class="axis" x1="-10" y1="163.2" x2="0" y2="163.2"/>
      <line class="axis" x1="-10" y1="55.0" x2="0" y2="55.0"/>
      <text class="tick" x="-26" y="604" text-anchor="end">0.0</text>
      <text class="tick" x="-26" y="496" text-anchor="end">0.2</text>
      <text class="tick" x="-26" y="388" text-anchor="end">0.4</text>
      <text class="tick" x="-26" y="279" text-anchor="end">0.6</text>
      <text class="tick" x="-26" y="171" text-anchor="end">0.8</text>
      <text class="tick" x="-26" y="63" text-anchor="end">1.0</text>
    </g>

    <text class="annotation" x="18" y="82">Δ vs final correct: +18.0% [+8.4%, +28.4%]</text>
    <text class="annotation" x="18" y="107">Δ vs stable wrong: +18.8% [+8.4%, +29.6%]</text>

    <rect x="39" y="466.2" width="229" height="129.8" fill="#b91c1c"/>
    <rect x="326" y="563.5" width="229" height="32.5" fill="#15803d"/>
    <rect x="613" y="567.9" width="229" height="28.1" fill="#6b7280"/>
    <text class="bar-value" x="153.5" y="456.2" text-anchor="middle">24.0%</text>
    <text class="bar-value" x="440.5" y="553.5" text-anchor="middle">6.0%</text>
    <text class="bar-value" x="727.5" y="557.9" text-anchor="middle">5.2%</text>

    <line class="axis" x1="153.5" y1="596" x2="153.5" y2="606"/>
    <line class="axis" x1="440.5" y1="596" x2="440.5" y2="606"/>
    <line class="axis" x1="727.5" y1="596" x2="727.5" y2="606"/>
    <text class="tick" x="153.5" y="666" text-anchor="middle" transform="rotate(-15 153.5 666)">Seed-0 loss</text>
    <text class="tick" x="440.5" y="666" text-anchor="middle" transform="rotate(-15 440.5 666)">Final-correct</text>
    <text class="tick" x="727.5" y="666" text-anchor="middle" transform="rotate(-15 727.5 666)">Stable-wrong</text>
  </g>
</svg>
